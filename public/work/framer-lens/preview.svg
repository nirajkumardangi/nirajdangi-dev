<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <rect width="1280" height="800" fill="#0A0A0A"/>

  <rect width="1280" height="60" fill="#141414"/>
  <text x="60" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">framer-lens</text>
  <rect x="180" y="20" width="140" height="22" rx="11" fill="rgba(255,255,255,0.1)"/>
  <text x="194" y="35" font-family="monospace" font-size="10" font-weight="600" fill="#E5E5E5">INTERACTIVE MOTION</text>

  <!-- Canvas Layout with Interactive Physics Simulator -->
  <rect x="60" y="90" width="1160" height="650" rx="12" fill="#141414" stroke="#262626"/>
  
  <text x="100" y="140" font-family="monospace" font-size="12" fill="#A3A3A3" letter-spacing="1">PHYSICS ENGINE: SPRING DAMPING (30) · STIFFNESS (120)</text>
  
  <!-- Interactive Pill Component 1 -->
  <rect x="100" y="170" width="340" height="240" rx="16" fill="#1F1F1F" stroke="#333333"/>
  <text x="130" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Morphing Segmented Tab</text>
  <text x="130" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#A3A3A3">Zero-CLS sliding pill layout morph using layoutId.</text>
  
  <rect x="130" y="270" width="280" height="44" rx="22" fill="#292929"/>
  <rect x="132" y="272" width="90" height="40" rx="20" fill="#5B5BD6"/>
  <text x="160" y="297" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Day</text>
  <text x="245" y="297" font-family="system-ui, sans-serif" font-size="13" fill="#737373">Week</text>
  <text x="330" y="297" font-family="system-ui, sans-serif" font-size="13" fill="#737373">Month</text>

  <rect x="130" y="340" width="130" height="36" rx="6" fill="#292929"/>
  <text x="145" y="363" font-family="monospace" font-size="11" fill="#A3A3A3">Copy TSX →</text>

  <!-- Interactive Component 2: Spotlight Card -->
  <rect x="470" y="170" width="340" height="240" rx="16" fill="#1F1F1F" stroke="#333333"/>
  <circle cx="640" cy="270" r="80" fill="url(#lensGlow)" opacity="0.3"/>
  <text x="500" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Cursor Spotlight</text>
  <text x="500" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#A3A3A3">GPU dynamic radial-gradient tracking clientXY.</text>
  <rect x="500" y="270" width="280" height="60" rx="8" fill="#292929" stroke="#404040"/>
  <text x="520" y="305" font-family="monospace" font-size="12" fill="#5B5BD6">--spotlight-x: 54% --spotlight-y: 62%</text>

  <!-- Interactive Component 3: Safe-Area Bottom Bar -->
  <rect x="840" y="170" width="340" height="240" rx="16" fill="#1F1F1F" stroke="#333333"/>
  <text x="870" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Safe-Area Sheet</text>
  <text x="870" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#A3A3A3">Full-height accessible drawer with focus-trap.</text>
  <rect x="870" y="270" width="280" height="44" rx="8" fill="#15803D"/>
  <text x="940" y="297" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Preview Sheet Drawer</text>

  <!-- Bottom Code Export Bar -->
  <rect x="100" y="440" width="1080" height="260" rx="10" fill="#0A0A0A" stroke="#262626"/>
  <text x="130" y="480" font-family="monospace" font-size="12" fill="#5B5BD6">useSpring(scrollYProgress, { stiffness: 120, damping: 30 })</text>
  <text x="130" y="520" font-family="monospace" font-size="13" fill="#E5E5E5">
    export function FramerLensPreview() {
  </text>
  <text x="160" y="555" font-family="monospace" font-size="13" fill="#A3A3A3">
    return &lt;motion.div whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }} /&gt;
  </text>
  <text x="130" y="590" font-family="monospace" font-size="13" fill="#E5E5E5">
    }
  </text>
  <text x="130" y="640" font-family="system-ui, sans-serif" font-size="13" fill="#737373">Tested at 60fps on low-end Android mobile Chrome and high-refresh desktop monitors.</text>
</svg>

