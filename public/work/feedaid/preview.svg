  <text x="80" y="420" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Morabadi Banquet</text>
  <text x="80" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#A7F3D0">120 packed vegetarian dinners picked up. Delivered to RIMS Patient Shelter.</text>
  <text x="80" y="520" font-family="monospace" font-size="24" font-weight="700" fill="#34D399">120 Meals</text>
  <text x="80" y="545" font-family="system-ui, sans-serif" font-size="12" fill="#6EE7B7">Verified hygienic temperature check</text>

  <rect x="460" y="340" width="360" height="390" rx="12" fill="#022C22" stroke="#065F46"/>
  <rect x="480" y="360" width="130" height="24" rx="4" fill="#991B1B"/>
  <text x="490" y="376" font-family="monospace" font-size="10" font-weight="700" fill="#FCA5A5">SURPLUS ALERT</text>
  <text x="480" y="420" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Doranda Community Hall</text>
  <text x="480" y="450" font-family="system-ui, sans-serif" font-size="13" fill="#A7F3D0">250 meals ready for immediate transit. Looking for volunteer driver with van.</text>
