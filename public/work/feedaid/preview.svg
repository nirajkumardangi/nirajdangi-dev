  <text x="560" y="660" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Accept Transit Run →</text>

  <rect x="860" y="340" width="360" height="390" rx="12" fill="#065F46"/>
  <text x="890" y="390" font-family="monospace" font-size="11" letter-spacing="1" fill="#A7F3D0">IMPACT METRIC</text>
