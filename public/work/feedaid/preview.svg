  <text x="60" y="245" font-family="Georgia, serif" font-style="italic" font-size="44" font-weight="400" fill="#A7F3D0">with local shelters in 60 minutes.</text>
  <text x="60" y="290" font-family="system-ui, sans-serif" font-size="16" fill="#D1FAE5">Real-time volunteer alerts for wedding halls, corporate events, and restaurants across Ranchi.</text>

  <!-- 3 Live Activity Cards -->
  <rect x="60" y="340" width="360" height="390" rx="12" fill="#022C22" stroke="#065F46"/>
  <rect x="80" y="360" width="110" height="24" rx="4" fill="#065F46"/>
