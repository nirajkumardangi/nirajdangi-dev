  <text x="32" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">✦ Long-form Blog Post</text>
  
  <rect x="16" y="160" width="228" height="40" rx="6" fill="#1A153E"/>
  <text x="32" y="185" font-family="system-ui, sans-serif" font-size="13" fill="#A5A0D1">LinkedIn Viral Hooks</text>
  
  <rect x="16" y="210" width="228" height="40" rx="6" fill="#1A153E"/>
  <text x="32" y="235" font-family="system-ui, sans-serif" font-size="13" fill="#A5A0D1">Product Launch Copy</text>

  <!-- Editor Canvas (Center) -->
  <rect x="290" y="80" width="940" height="690" rx="10" fill="#14112E" stroke="#25214E"/>
  
  <text x="330" y="130" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#7E78B2">TOPIC PROMPT</text>
  <rect x="330" y="145" width="860" height="50" rx="8" fill="#1B1740" stroke="#332D6B"/>
  <text x="350" y="176" font-family="system-ui, sans-serif" font-size="14" fill="#FFFFFF">How doctors in tier-2 cities can capture patient appointments via WhatsApp websites</text>

  <rect x="330" y="220" width="860" height="500" rx="8" fill="#0C0A1D" stroke="#25214E"/>
  
  <!-- Editor Document Content -->
  <text x="360" y="270" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">
    The Tier-2 Healthcare Playbook: Why WhatsApp Beats Booking Portals
  </text>
  <text x="360" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF" line-height="24">
    For private clinics in cities like Ranchi, Patna, and Bhubaneswar, patient hesitation is rarely about medical qualification—it is about accessibility and friction. Traditional booking portals require downloading apps, creating accounts, and paying convenience surcharges...
  </text>
  <text x="360" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#C084FC">
    Key Advantages of Frictionless WhatsApp Booking:
  </text>
  <text x="360" y="420" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">
    1. Zero onboarding barrier for elderly patients and tier-2 families.
  </text>
  <text x="360" y="450" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">
    2. Direct conversational triage: assistants confirm appointment tokens in real time.
  </text>
  <text x="360" y="480" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">
    3. Automated reminder broadcasts reduce clinic OPD no-show rates by 45%.
  </text>

  <rect x="1030" y="660" width="140" height="42" rx="6" fill="#6366F1"/>
  <text x="1055" y="686" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Export to CMS →</text>
