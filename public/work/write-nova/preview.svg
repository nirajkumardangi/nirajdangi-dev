  <text x="1155" y="35" font-family="system-ui" font-size="12" fill="#FFFFFF">N</text>

  <!-- Left Sidebar / Workspaces -->
  <rect x="0" y="60" width="260" height="740" fill="#100D26"/>
  <line x1="260" y1="60" x2="260" y2="800" stroke="#25214E" stroke-width="1"/>
  
  <text x="24" y="95" font-family="monospace" font-size="11" fill="#7E78B2" letter-spacing="1">TEMPLATES</text>
